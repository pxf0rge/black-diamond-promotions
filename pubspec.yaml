name: bd_accounting
description: "Event Ticket Tracker - Black Diamond Promotions"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.20.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  equatable: ^2.0.7
  uuid: ^4.5.1
  collection: ^1.19.1
  path_provider: ^2.1.5
  local_auth: ^2.3.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_1024.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#111111"
  image: assets/icon/app_icon_foreground.png
  ios: true
  android: true
  android_12:
    color: "#111111"
    image: assets/icon/app_icon_foreground.png
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
